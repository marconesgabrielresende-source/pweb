<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>

    <!-- Título -->
    <h1>Tabelas</h1>

    <!-- Primeira tabela -->
    <table border="1">
        <tr>
            <td>Coluna 01 - Linha 01</td>
            <td>Coluna 02 - Linha 01</td>
        </tr>

        <tr>
            <td>Coluna 01 - Linha 02</td>
            <td>Coluna 02 - Linha 02</td>
        </tr>
    </table>

    <br><br>

    <!-- Segunda tabela com imagem -->
    <h1>Tabelas</h1>

    <table border="1">
        <tr>
            <td>
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Porsche_Carrera_GT.jpg/320px-Porsche_Carrera_GT.jpg" width="150px">
            </td>
            <td>Coluna 02 - Linha 01</td>
        </tr>

        <tr>
            <td>Coluna 01 - Linha 02</td>
            <td>Coluna 02 - Linha 02</td>
        </tr>
    </table>

    <!-- Linha separadora -->
    <hr>

    <!-- Título da listagem -->
    <h1>Listagem de Produtos</h1>

    <!-- Tabela de produtos -->
    <table border="1">

        <!-- Cabeçalho -->
        <tr>
            <td><b>Código</b></td>
            <td><b>Descrição</b></td>
            <td><b>Valor (R$)</b></td>
        </tr>

        <!-- Produtos -->
        <tr>
            <td>00001</td>
            <td>Notebook</td>
            <td>2500,00</td>
        </tr>

        <tr>
            <td>00002</td>
            <td>Monitor</td>
            <td>500,00</td>
        </tr>

        <tr>
            <td>00003</td>
            <td>Roteador Wi-Fi</td>
            <td>150,00</td>
        </tr>

    </table>

</body>
</html>
